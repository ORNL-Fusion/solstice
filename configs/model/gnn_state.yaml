# State model (control params -> plasma), SOLSTICE GNN (latent-mesh encode-process-decode).
task: state
model:
  class: gnn
  config:
    node_features: 2      # [psi_n_approx, |B|] (solstice.graphs.default_node_features)
    param_dim: 5          # engineered inputs: ptot, core_fueling, puff_D2, dna, chi
    out_features: 4       # te, ti, ne, ua_D1
    hidden: 128
    n_process_layers: 8
variables:
  inputs: [ptot, core_fueling, puff_D2, dna, chi]
  outputs: [te, ti, ne, ua_D1]
graph:
  n_latent: 512
  k_nn: 6
